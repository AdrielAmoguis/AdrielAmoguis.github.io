<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Content Manager | Adriel Amoguis</title>
    <link rel="stylesheet" href="https://unpkg.com/@sveltia/cms/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: #f8fafc;
        }
        #cms-root {
            min-height: 100vh;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="cms-root">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p style="margin-top: 20px; color: #64748b;">Loading Content Manager...</p>
        </div>
    </div>
    <script type="module">
        import { cmsConfig } from '/cms/config.js';
        import SveltiaCMS from '@sveltia/cms';
        
        const cms = new SveltiaCMS(cmsConfig);
        cms.init();
    </script>
</body>
</html>
