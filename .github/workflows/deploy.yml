name: Deploy on Content Update

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      content-changed: ${{ steps.changes.outputs.content }}
      cms-changed: ${{ steps.changes.outputs.cms }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for content changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            content:
              - '_posts/**'
              - '_publications/**'
              - '_projects/**'
              - '_config.yml'
            cms:
              - 'public/admin/**'
              - 'cms/**'

  build-and-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.content-changed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build site
        run: npm run build
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          
      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          destination_dir: preview/pr-${{ github.event.number }}
          
      - name: Comment PR with preview link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const { number } = context.issue;
            const previewUrl = `https://adrielamoguis.com/preview/pr-${number}`;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: `🚀 **Preview available**: [${previewUrl}](${previewUrl})\n\nChanges are deployed and ready for review!`
            });